services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ride_sharing_postgres
    environment:
      POSTGRES_DB: ride_sharing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bunz3120
    ports:
      - "3120:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ride_sharing"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    container_name: ride_sharing_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:bunz3120@postgres:5432/ride_sharing
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data: